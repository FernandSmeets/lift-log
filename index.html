<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161A">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161A; --surface:#1E2127; --surface-hi:#262A31;
    --border:#33383F; --text:#ECEEF0; --text-dim:#8B9099;
    --accent:#E8543E; --accent-dim:#E8543E33; --good:#6FCF97;
    --feel-easy:#6FCF97; --feel-medium:#F2C94C; --feel-hard:#EB5757;
  }
  html{ height:100%; -webkit-text-size-adjust:100%; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; min-height:100dvh;
    padding:0 0 calc(6.5rem + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;
    touch-action:manipulation;
  }
  .num{ font-family:'Oswald',sans-serif; font-variant-numeric:tabular-nums; }

  header{
    padding:calc(1.25rem + env(safe-area-inset-top)) calc(1.25rem + env(safe-area-inset-right)) 1rem calc(1.25rem + env(safe-area-inset-left));
    border-bottom:1px solid var(--border);
    display:flex; align-items:flex-start; justify-content:space-between;
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header .titles h1{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:1.5rem;
    margin:0 0 .15rem; letter-spacing:.01em;
  }
  header .date{ color:var(--text-dim); font-size:.9rem; }
  .cog-btn{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    width:2.75rem; height:2.75rem; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-dim); flex:0 0 auto; margin-top:.1rem;
    -webkit-user-select:none; user-select:none;
  }
  .cog-btn:active{ color:var(--text); border-color:var(--accent); background:var(--surface-hi); }
  .cog-btn svg{ width:1.2rem; height:1.2rem; }

  main{
    max-width:480px; margin:0 auto;
    padding:1rem calc(1.1rem + env(safe-area-inset-right)) 1rem calc(1.1rem + env(safe-area-inset-left));
  }

  .row-label{ font-size:.72rem; color:var(--text-dim); margin:0 0 .4rem; letter-spacing:.02em; }
  .chip-row{
    display:flex; gap:.5rem; overflow-x:auto; padding-bottom:.7rem; margin-bottom:.9rem;
    border-bottom:1px solid var(--border); -webkit-overflow-scrolling:touch;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; min-height:2.75rem; padding:.5rem 1rem; border-radius:9px;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text-dim); font-size:.9rem; font-weight:500;
    display:flex; align-items:center;
    cursor:pointer; white-space:nowrap; transition:background .12s, color .12s, border-color .12s;
    -webkit-user-select:none; user-select:none;
  }
  .chip.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--text); }
  .chip.add{ color:var(--accent); border-style:dashed; }
  .chip:active{ background:var(--surface-hi); }
  .chip.active:active{ background:var(--accent-dim); }

  .chip-row-wrap{ position:relative; margin-bottom:.9rem; }
  .chip-row-wrap .chip-row{ margin-bottom:0; }
  .chip-scroll-btn{
    display:none; position:absolute; top:0; height:calc(100% - .7rem);
    width:1.8rem; align-items:center; justify-content:center;
    background:none; border:none; color:var(--text-dim); cursor:pointer; z-index:3;
    padding:0;
  }
  .chip-scroll-btn.left{ left:-.35rem; background:linear-gradient(to right, var(--bg) 45%, transparent); justify-content:flex-start; }
  .chip-scroll-btn.right{ right:-.35rem; background:linear-gradient(to left, var(--bg) 45%, transparent); justify-content:flex-end; }
  .chip-scroll-btn svg{ width:1.15rem; height:1.15rem; }
  .chip-scroll-btn:hover{ color:var(--text); }
  .chip-scroll-btn.disabled{ opacity:0; pointer-events:none; }
  @media (hover:hover) and (pointer:fine){
    .chip-row-wrap .chip-row{ padding-left:1.6rem; padding-right:1.6rem; }
    .chip-scroll-btn{ display:flex; }
  }

  .panel{
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:1rem; margin-bottom:1rem;
  }
  .panel h2{ font-size:.78rem; color:var(--text-dim); margin:0 0 .7rem; font-weight:500; letter-spacing:.02em; }
  .panel h2 .when{ color:var(--text-dim); }

  .set-row{
    display:grid; grid-template-columns:1.6rem 1fr 1fr; gap:.6rem;
    align-items:center; padding:.4rem 0;
  }
  .set-row + .set-row{ border-top:1px solid var(--border); }
  .set-idx{ color:var(--text-dim); font-size:.85rem; }
  .prev-val{ color:var(--text-dim); font-size:1.05rem; }
  .prev-val .num{ color:var(--text); font-size:1.1rem; }
  .empty-prev{ color:var(--text-dim); font-size:.88rem; padding:.3rem 0; }

  .today-panel .set-row{ grid-template-columns:1.6rem 1fr 1fr 2.5rem; }
  input.field{
    width:100%; min-width:0; background:var(--surface-hi); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:.65rem .3rem;
    font-family:'Oswald',sans-serif; font-size:16px; text-align:center;
    font-variant-numeric:tabular-nums; min-height:2.6rem;
  }
  input.field:focus{ outline:none; border-color:var(--accent); }
  input.field::placeholder{ color:var(--text-dim); opacity:.6; }
  .unit{ font-size:.7rem; color:var(--text-dim); display:block; margin-top:.15rem; text-align:center; }

  .stepper{ display:flex; align-items:stretch; gap:.25rem; }
  .stepper-btn{
    flex:0 0 auto; width:1.55rem; min-height:2.6rem; border-radius:7px;
    border:1px solid var(--border); background:var(--surface-hi); color:var(--text);
    font-size:1.05rem; line-height:1; display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-user-select:none; user-select:none; padding:0;
  }
  .stepper-btn:active{ border-color:var(--accent); color:var(--accent); }

  .feel-row{ display:flex; gap:.5rem; margin:.5rem 0 0; }
  .feel-chip{
    flex:1; text-align:center; padding:.55rem .3rem; min-height:2.6rem; border-radius:8px; cursor:pointer;
    border:1.5px solid var(--border); background:var(--surface-hi); color:var(--text-dim);
    font-size:.85rem; font-weight:500; display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  .feel-chip.easy{ border-color:var(--feel-easy); }
  .feel-chip.easy.active{ background:var(--feel-easy); color:#0B1F16; }
  .feel-chip.medium{ border-color:var(--feel-medium); }
  .feel-chip.medium.active{ background:var(--feel-medium); color:#241D06; }
  .feel-chip.hard{ border-color:var(--feel-hard); }
  .feel-chip.hard.active{ background:var(--feel-hard); color:#2A0B0B; }

  .feel-badge{
    display:inline-flex; align-items:center; font-size:.66rem; font-weight:600;
    padding:.1rem .5rem; border-radius:999px; vertical-align:middle;
  }
  .feel-badge.easy{ background:var(--feel-easy); color:#0B1F16; }
  .feel-badge.medium{ background:var(--feel-medium); color:#241D06; }
  .feel-badge.hard{ background:var(--feel-hard); color:#2A0B0B; }

  .last-note{ color:var(--text-dim); font-size:.85rem; font-style:italic; margin-top:.6rem; padding-top:.5rem; border-top:1px solid var(--border); }

  .pr-badge{ font-size:.7rem; color:var(--good); font-weight:600; white-space:nowrap; }
  .icon-btn{
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    width:2.75rem; height:2.75rem; padding:0;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  .icon-btn:active{ color:var(--accent); }
  .icon-btn svg{ width:1.1rem; height:1.1rem; }
  .icon-btn:disabled{ opacity:.25; cursor:default; }
  .icon-btn:disabled:active{ color:var(--text-dim); }
  .icon-btn.edit-icon{ font-size:1.5rem; line-height:1; }

  .add-set-btn{
    width:100%; min-height:2.75rem; padding:.6rem; margin-top:.5rem; background:none;
    border:1px dashed var(--border); border-radius:8px; color:var(--text-dim);
    font-size:.9rem; cursor:pointer;
  }
  .add-set-btn:active{ border-color:var(--accent); color:var(--accent); }

  .save-btn{
    width:100%; min-height:3rem; padding:.85rem; background:var(--accent); border:none;
    border-radius:9px; color:#14161A; font-weight:600; font-size:1rem;
    cursor:pointer; margin-top:.25rem;
  }
  .save-btn:disabled{ background:var(--surface-hi); color:var(--text-dim); cursor:default; }
  .save-btn:not(:disabled):active{ filter:brightness(.95); }

  .saved-note{ text-align:center; color:var(--good); font-size:.85rem; margin-top:.6rem; min-height:1.1em; }

  .save-wrap{ position:relative; }
  .save-check{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.4);
    opacity:0; pointer-events:none; font-size:1.3rem; font-weight:700; color:#14161A;
    background:var(--good); width:2.3rem; height:2.3rem; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition: opacity .08s ease, transform .08s ease;
  }
  .save-check.show{
    opacity:1; transform:translate(-50%,-50%) scale(1);
    transition: opacity .08s ease, transform .08s ease;
  }

  .history-toggle{
    text-align:center; color:var(--text-dim); font-size:.85rem; margin-top:1rem;
    cursor:pointer; text-decoration:underline; text-decoration-color:var(--border);
  }
  .history-list{ margin-top:.75rem; }
  .history-entry{ padding:.6rem 0; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; justify-content:space-between; font-size:.88rem; }
  .history-entry .d{ color:var(--text-dim); }
  .history-entry .s{ text-align:right; }
  .history-entry .date-edit-trigger{ cursor:pointer; color:var(--text-dim); }
  .history-entry .date-edit-trigger:hover{ color:var(--text); }
  .history-entry-editing{ align-items:center; }
  .history-note{ flex-basis:100%; color:var(--text-dim); font-size:.8rem; font-style:italic; margin-top:.3rem; }

  .empty-state{ text-align:center; padding:2.5rem 1rem; color:var(--text-dim); }
  .empty-state .num{ font-size:2.2rem; display:block; margin-bottom:.3rem; color:var(--text); }

  /* Dialogs */
  dialog{
    border:none; border-radius:16px; background:var(--surface); color:var(--text);
    padding:0; width:min(420px, 92vw); max-height:85dvh;
    margin:auto;
  }
  @media (max-width:480px){
    dialog{ width:100vw; max-width:100vw; max-height:88dvh; border-radius:16px 16px 0 0;
      position:fixed; bottom:0; left:0; right:0; top:auto; margin:0; }
  }
  dialog::backdrop{ background:rgba(0,0,0,.55); }
  .dialog-head{
    padding:1rem calc(1.1rem + env(safe-area-inset-right)) 1rem calc(1.1rem + env(safe-area-inset-left));
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .dialog-head h3{ margin:0; font-family:'Oswald',sans-serif; font-size:1.15rem; }
  .dialog-close{
    background:none; border:none; color:var(--text-dim); font-size:1.3rem; cursor:pointer; line-height:1;
    width:2.5rem; height:2.5rem; display:flex; align-items:center; justify-content:center; margin:-0.5rem -0.5rem -0.5rem 0;
  }
  .dialog-close:active{ color:var(--text); }
  .dialog-body{
    padding:1rem calc(1.1rem + env(safe-area-inset-right)) calc(1.25rem + env(safe-area-inset-bottom)) calc(1.1rem + env(safe-area-inset-left));
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    max-height:calc(88dvh - 3.2rem);
  }

  .tabs{
    display:flex; gap:.35rem; margin-bottom:1rem;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; text-align:center; padding:.6rem .85rem; min-height:2.6rem; border-radius:8px; cursor:pointer;
    background:var(--surface-hi); color:var(--text-dim); font-size:.8rem; font-weight:500; white-space:nowrap;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  .tab.active{ background:var(--accent-dim); color:var(--text); }

  .settings-row{
    display:flex; align-items:center; gap:.5rem; padding:.4rem 0;
    border-bottom:1px solid var(--border);
  }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row .name{ flex:1; font-size:.92rem; }
  .settings-row .name.hidden-ex{ color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--border); }
  .reorder-btns{ display:flex; flex-direction:column; gap:1px; }
  .reorder-btns .icon-btn{ padding:0; width:2rem; height:1.35rem; }
  .reorder-btns svg{ width:.9rem; height:.9rem; }

  .plain-input{
    width:100%; padding:.7rem .6rem; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-hi); color:var(--text); font-size:16px; margin-bottom:.7rem;
  }
  .plain-input:focus{ outline:none; border-color:var(--accent); }
  select.plain-input{ -webkit-appearance:none; appearance:none; }
  .form-actions{ display:flex; gap:.5rem; justify-content:flex-end; margin-top:.4rem; }
  .btn{
    padding:.6rem 1.1rem; min-height:2.6rem; border-radius:8px; border:1px solid var(--border);
    background:none; color:var(--text); cursor:pointer; font-size:.9rem;
    -webkit-user-select:none; user-select:none;
  }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#14161A; font-weight:600; }
  .btn.danger{ border-color:var(--accent); color:var(--accent); }
  .btn:active{ background:var(--surface-hi); }
  .btn.primary:active{ filter:brightness(.95); background:var(--accent); }

  .template-item{
    padding:.7rem 0; border-bottom:1px solid var(--border);
  }
  .template-item:last-child{ border-bottom:none; }
  .template-item-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:.4rem; }
  .template-item-head .name{ font-weight:600; font-size:.95rem; }
  .template-actions{ display:flex; gap:.3rem; }
  .checklist{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.4rem; }
  .check-chip{
    padding:.5rem .75rem; min-height:2.4rem; display:flex; align-items:center; border-radius:8px; font-size:.82rem; cursor:pointer;
    background:var(--surface-hi); border:1px solid var(--border); color:var(--text-dim);
    -webkit-user-select:none; user-select:none;
  }
  .check-chip.on{ background:var(--accent-dim); border-color:var(--accent); color:var(--text); }
  .add-template-btn{
    width:100%; margin-top:.8rem; padding:.6rem; background:none; border:1px dashed var(--border);
    border-radius:7px; color:var(--accent); cursor:pointer; font-size:.88rem;
  }
  .section-title{ font-size:.72rem; color:var(--text-dim); margin:0 0 .5rem; letter-spacing:.02em; }
  .settings-version{
    text-align:center; color:var(--text-dim); font-size:.72rem;
    margin-top:1.25rem; padding-top:.9rem; border-top:1px solid var(--border);
    font-variant-numeric:tabular-nums;
  }

  .rest-fab-wrap{
    position:fixed;
    right:calc(1.1rem + env(safe-area-inset-right));
    bottom:calc(1.25rem + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:.6rem; z-index:20;
  }
  .rest-fab{
    width:4rem; height:4rem; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#14161A;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 16px rgba(0,0,0,.4);
    font-family:'Oswald',sans-serif; font-weight:600;
    -webkit-user-select:none; user-select:none;
  }
  .rest-fab.running{ background:var(--good); }
  .rest-fab:active{ filter:brightness(.95); }
  .rest-fab.done{ animation: restPulse .55s ease-in-out 3; }
  .rest-fab-icon{ display:flex; align-items:center; justify-content:center; }
  .rest-fab-icon svg{ width:1.6rem; height:1.6rem; }
  .rest-fab-text{ font-size:1.05rem; font-variant-numeric:tabular-nums; }
  .rest-reset-btn{
    width:2.75rem; height:2.75rem; border-radius:50%; cursor:pointer;
    border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
    -webkit-user-select:none; user-select:none;
  }
  .rest-reset-btn:active{ color:var(--text); border-color:var(--accent); }
  .rest-reset-btn svg{ width:1rem; height:1rem; }
  @keyframes restPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }

  .chart-card{
    background:var(--surface-hi); border:1px solid var(--border); border-radius:10px;
    padding:.7rem .6rem .5rem; margin-bottom:.7rem;
  }
  .chart-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.3rem; }
  .chart-title{ font-size:.78rem; color:var(--text-dim); }
  .chart-current{ font-size:.85rem; color:var(--text-dim); }
  .chart-wrap{ position:relative; }
  .chart-svg{ width:100%; height:auto; display:block; }
  .chart-grid{ stroke:var(--border); stroke-width:1; }
  .chart-point-label{ font-family:'Oswald',sans-serif; font-size:11px; font-weight:600; }
  .chart-axis-labels{ display:flex; justify-content:space-between; font-size:.68rem; color:var(--text-dim); margin-top:.15rem; }
  .chart-tip{
    position:absolute; transform:translate(-50%,-100%); margin-top:-8px;
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:.3rem .55rem; font-size:.72rem; color:var(--text); white-space:nowrap;
    pointer-events:none; box-shadow:0 2px 10px rgba(0,0,0,.4); z-index:2;
  }
</style>
</head>
<body>

<header>
  <div class="titles">
    <h1>Lift Log</h1>
    <div class="date" id="dateLabel"></div>
  </div>
  <button class="cog-btn" onclick="openSettings()" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
  </button>
</header>

<main>
  <div class="row-label">Template</div>
  <div class="chip-row" id="templateRow"></div>

  <div class="row-label">Exercise</div>
  <div class="chip-row-wrap">
    <button class="chip-scroll-btn left" id="exerciseScrollLeft" onclick="scrollExerciseRow(-1)" aria-label="Scroll left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="chip-row" id="exerciseRow"></div>
    <button class="chip-scroll-btn right" id="exerciseScrollRight" onclick="scrollExerciseRow(1)" aria-label="Scroll right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div id="content"></div>
</main>

<div class="rest-fab-wrap">
  <button class="rest-reset-btn" id="restResetBtn" onclick="resetRestTimer()" aria-label="Reset rusttimer" style="display:none;"></button>
  <button class="rest-fab" id="restFab" onclick="toggleRestTimer()" aria-label="Start rusttimer">
    <span id="restFabIcon" class="rest-fab-icon"></span>
    <span id="restFabText" class="rest-fab-text" style="display:none;"></span>
  </button>
</div>

<!-- Add exercise dialog -->
<dialog id="addExerciseDialog">
  <div class="dialog-head"><h3>Add exercise</h3><button class="dialog-close" onclick="document.getElementById('addExerciseDialog').close()">✕</button></div>
  <div class="dialog-body">
    <input type="text" class="plain-input" id="newExerciseName" placeholder="e.g. Romanian Deadlift" maxlength="40">
    <div class="form-actions">
      <button class="btn" onclick="document.getElementById('addExerciseDialog').close()">Cancel</button>
      <button class="btn primary" onclick="confirmAddExercise()">Add</button>
    </div>
  </div>
</dialog>

<!-- Settings dialog -->
<dialog id="settingsDialog">
  <div class="dialog-head"><h3>Settings</h3><button class="dialog-close" onclick="document.getElementById('settingsDialog').close()">✕</button></div>
  <div class="dialog-body">
    <div class="tabs">
      <div class="tab" id="tabExercisesBtn" onclick="switchTab('exercises')">Exercises</div>
      <div class="tab" id="tabTemplatesBtn" onclick="switchTab('templates')">Templates</div>
      <div class="tab" id="tabProgressBtn" onclick="switchTab('progress')">Progress</div>
      <div class="tab" id="tabTimerBtn" onclick="switchTab('timer')">Timer</div>
      <div class="tab" id="tabDataBtn" onclick="switchTab('data')">Data</div>
    </div>
    <div id="tabExercises"></div>
    <div id="tabTemplates"></div>
    <div id="tabProgress"></div>
    <div id="tabTimer"></div>
    <div id="tabData"></div>
    <div class="settings-version" id="settingsVersion"></div>
  </div>
</dialog>

<!-- New/edit template dialog -->
<dialog id="templateDialog">
  <div class="dialog-head"><h3 id="templateDialogTitle">New template</h3><button class="dialog-close" onclick="document.getElementById('templateDialog').close()">✕</button></div>
  <div class="dialog-body">
    <input type="text" class="plain-input" id="templateNameInput" placeholder="Template name" maxlength="30">
    <div class="section-title">Exercises in this template</div>
    <div class="checklist" id="templateChecklist"></div>
    <div class="form-actions">
      <button class="btn" onclick="document.getElementById('templateDialog').close()">Cancel</button>
      <button class="btn primary" onclick="confirmSaveTemplate()">Save</button>
    </div>
  </div>
</dialog>

<script>
const APP_VERSION = '2.4.3';
const STORE_KEY = 'liftlog_data_v2';

const DEFAULT_EXERCISES = [
  'Dumbbell Chest Press','Lateral Raise','Lat Pulldown','Preacher Curl',
  'Tricep Pulldown','Hammer Curls','Dual Cable Fly',
  'Squat','Deadlift','Leg Press','Leg Curl','Calf Raise'
];
const DEFAULT_TEMPLATES = [
  { name:'Chest Day', exercises:['Dumbbell Chest Press','Lateral Raise','Lat Pulldown','Preacher Curl','Tricep Pulldown','Hammer Curls','Dual Cable Fly'] },
  { name:'Leg Day', exercises:['Squat','Deadlift','Leg Press','Leg Curl','Calf Raise'] }
];

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.settings) parsed.settings = { restSeconds: 90 };
      return parsed;
    }
  }catch(e){ console.error('load failed', e); }
  return {
    exercises: DEFAULT_EXERCISES.map(name => ({ name, hidden:false })),
    templates: DEFAULT_TEMPLATES.map(t => ({ ...t })),
    sessions: {},
    settings: { restSeconds: 90 }
  };
}
function ensureSettings(){
  if(!data.settings) data.settings = { restSeconds: 90 };
  if(typeof data.settings.restSeconds !== 'number' || isNaN(data.settings.restSeconds) || data.settings.restSeconds <= 0){
    data.settings.restSeconds = 90;
  }
  if(typeof data.settings.backupEmail !== 'string'){
    data.settings.backupEmail = '';
  }
}
function saveData(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch(e){ console.error('save failed', e); }
}

let data = loadData();
let currentTemplate = 'All';
let selectedExercise = null;
let todaySets = [{weight:'', reps:''}];
let todayFeel = '';
let todayNote = '';
let historyOpen = false;
let editingHistoryIdx = null;
let settingsTab = 'exercises';
let progressExercise = null;
let chartIdCounter = 0;
let editingTemplateName = null; // null = creating new

const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
};

document.getElementById('dateLabel').textContent =
  new Date().toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});

function visibleExerciseNames(){
  let names = data.exercises.filter(e => !e.hidden).map(e => e.name);
  if(currentTemplate !== 'All'){
    const tpl = data.templates.find(t => t.name === currentTemplate);
    const tplSet = tpl ? new Set(tpl.exercises) : new Set();
    names = names.filter(n => tplSet.has(n));
  }
  return names;
}

function getLastSession(exercise){
  const list = data.sessions[exercise] || [];
  const past = list.filter(s => s.date !== todayStr());
  if(past.length === 0) return null;
  return past[past.length - 1];
}
function getBestSet(exercise){
  const list = data.sessions[exercise] || [];
  let best = null;
  list.forEach(s => s.sets.forEach(set => {
    const w = parseFloat(set.weight);
    if(!isNaN(w) && (!best || w > best)) best = w;
  }));
  return best;
}

function renderTemplateChips(){
  const row = document.getElementById('templateRow');
  row.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (currentTemplate === 'All' ? ' active' : '');
  allChip.textContent = 'All';
  allChip.onclick = () => { currentTemplate = 'All'; ensureSelectedExercise(); render(); };
  row.appendChild(allChip);

  data.templates.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (currentTemplate === t.name ? ' active' : '');
    chip.textContent = t.name;
    chip.onclick = () => { currentTemplate = t.name; ensureSelectedExercise(); render(); };
    row.appendChild(chip);
  });
}

function ensureSelectedExercise(){
  const visible = visibleExerciseNames();
  if(!visible.includes(selectedExercise)){
    selectedExercise = visible[0] || null;
    if(selectedExercise) loadTodayState(selectedExercise);
    else { todaySets = [{weight:'', reps:''}]; todayFeel = ''; todayNote = ''; }
  }
}

function loadTodayState(exerciseName){
  const list = data.sessions[exerciseName] || [];
  const todaysExisting = list.find(s => s.date === todayStr());
  if(todaysExisting){
    todaySets = todaysExisting.sets.map(s => ({ weight: s.weight, reps: s.reps }));
    todayFeel = todaysExisting.feel || '';
    todayNote = todaysExisting.note || '';
    return;
  }
  const last = getLastSession(exerciseName);
  if(last && last.sets.length){
    todaySets = last.sets.map(s => ({ weight: s.weight, reps: s.reps }));
  } else {
    todaySets = [{ weight: '', reps: '' }];
  }
  todayFeel = '';
  todayNote = '';
}

function renderExerciseChips(){
  const row = document.getElementById('exerciseRow');
  row.innerHTML = '';
  const visible = visibleExerciseNames();
  visible.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (name === selectedExercise ? ' active' : '');
    chip.textContent = name;
    chip.onclick = () => { selectedExercise = name; loadTodayState(name); historyOpen=false; editingHistoryIdx=null; render(); };
    row.appendChild(chip);
  });
  const addChip = document.createElement('div');
  addChip.className = 'chip add';
  addChip.textContent = '+ Add';
  addChip.onclick = () => {
    document.getElementById('newExerciseName').value = '';
    document.getElementById('addExerciseDialog').showModal();
  };
  row.appendChild(addChip);
  updateExerciseScrollButtons();
}

function scrollExerciseRow(dir){
  const row = document.getElementById('exerciseRow');
  if(!row) return;
  row.scrollBy({ left: dir * 180, behavior: 'smooth' });
}

function updateExerciseScrollButtons(){
  const row = document.getElementById('exerciseRow');
  const left = document.getElementById('exerciseScrollLeft');
  const right = document.getElementById('exerciseScrollRight');
  if(!row || !left || !right) return;
  const maxScroll = row.scrollWidth - row.clientWidth;
  left.classList.toggle('disabled', row.scrollLeft <= 2);
  right.classList.toggle('disabled', row.scrollLeft >= maxScroll - 2);
}

function openAddExerciseFromSettings(){
  document.getElementById('newExerciseName').value = '';
  document.getElementById('addExerciseDialog').showModal();
}

function confirmAddExercise(){
  const name = document.getElementById('newExerciseName').value.trim();
  if(name && !data.exercises.some(e => e.name === name)){
    data.exercises.push({ name, hidden:false });
    selectedExercise = name;
    todaySets = [{weight:'', reps:''}];
    todayFeel = '';
    todayNote = '';
    saveData();
    render();
    renderExerciseSettings();
  }
  document.getElementById('addExerciseDialog').close();
}

function renderContent(){
  const content = document.getElementById('content');
  if(!selectedExercise){
    content.innerHTML = `<div class="empty-state"><span class="num">—</span>No exercises in this view yet. Add one, or pick a different template.</div>`;
    return;
  }

  const last = getLastSession(selectedExercise);
  const best = getBestSet(selectedExercise);

  let lastHtml = '';
  if(last){
    const lastFeelBadge = last.feel ? feelBadgeHtml(last.feel) : '';
    lastHtml = `<div class="panel">
      <h2>Last time <span class="when">· ${fmtDate(last.date)}</span>${lastFeelBadge}</h2>
      ${last.sets.map((s,i) => `
        <div class="set-row">
          <span class="set-idx">${i+1}</span>
          <span class="prev-val"><span class="num">${s.weight || '—'}</span> kg</span>
          <span class="prev-val"><span class="num">${s.reps || '—'}</span> reps</span>
        </div>
      `).join('')}
      ${last.note ? `<div class="last-note">"${escAttr(last.note)}"</div>` : ''}
    </div>`;
  } else {
    lastHtml = `<div class="panel"><h2>Last time</h2><div class="empty-prev">No previous session yet for ${selectedExercise}.</div></div>`;
  }

  const todayRows = todaySets.map((s, i) => {
    const w = parseFloat(s.weight);
    const isPr = best !== null && !isNaN(w) && w > best;
    return `
    <div class="set-row">
      <span class="set-idx">${i+1}</span>
      <div>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepValue(${i},'weight',-0.5)" aria-label="Decrease weight">−</button>
          <input class="field" type="number" inputmode="decimal" placeholder="${last && last.sets[i] ? last.sets[i].weight : '0'}"
            value="${s.weight}" oninput="updateSet(${i},'weight',this.value)">
          <button class="stepper-btn" onclick="stepValue(${i},'weight',0.5)" aria-label="Increase weight">+</button>
        </div>
        <span class="unit">kg</span>
      </div>
      <div>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepValue(${i},'reps',-1)" aria-label="Decrease reps">−</button>
          <input class="field" type="number" inputmode="numeric" placeholder="${last && last.sets[i] ? last.sets[i].reps : '0'}"
            value="${s.reps}" oninput="updateSet(${i},'reps',this.value)">
          <button class="stepper-btn" onclick="stepValue(${i},'reps',1)" aria-label="Increase reps">+</button>
        </div>
        <span class="unit">reps</span>
      </div>
      <button class="icon-btn" onclick="removeSet(${i})" aria-label="Remove set">✕</button>
      ${isPr ? `<span class="pr-badge">PR</span>` : ''}
    </div>`;
  }).join('');

  const hasAnyInput = todaySets.some(s => s.weight !== '' || s.reps !== '');

  content.innerHTML = `
    ${lastHtml}
    <div class="panel today-panel">
      <h2>Today</h2>
      ${todayRows}
      <button class="add-set-btn" onclick="addSet()">+ Add set</button>
      <div class="row-label" style="margin-top:.9rem;">How did it feel? (optional)</div>
      <div class="feel-row">
        <div class="feel-chip easy ${todayFeel === 'easy' ? 'active' : ''}" id="feelChip_easy" onclick="setTodayFeel('easy')">Easy</div>
        <div class="feel-chip medium ${todayFeel === 'medium' ? 'active' : ''}" id="feelChip_medium" onclick="setTodayFeel('medium')">Medium</div>
        <div class="feel-chip hard ${todayFeel === 'hard' ? 'active' : ''}" id="feelChip_hard" onclick="setTodayFeel('hard')">Hard</div>
      </div>
      <input type="text" class="plain-input" id="todayNoteInput" placeholder="Notes (optional)" maxlength="200"
        value="${escAttr(todayNote)}" oninput="updateTodayNote(this.value)" style="margin-top:.6rem;margin-bottom:0;">
      <div class="save-wrap">
        <button class="save-btn" id="saveBtn" onclick="saveSession()" ${hasAnyInput ? '' : 'disabled'}>Save session</button>
        <div class="save-check" id="saveCheck">✓</div>
      </div>
      <div class="saved-note" id="savedNote"></div>
    </div>
    <div class="history-toggle" onclick="toggleHistory()">${historyOpen ? 'Hide' : 'Show'} full history</div>
    <div id="historyList"></div>
  `;

  if(historyOpen) renderHistory();
}

function toggleHistory(){ historyOpen = !historyOpen; editingHistoryIdx = null; render(); }
function renderHistory(){
  const arr = data.sessions[selectedExercise] || [];
  const el = document.getElementById('historyList');
  if(!el) return;
  if(arr.length === 0){
    el.innerHTML = `<div class="empty-prev">No sessions logged yet.</div>`;
    return;
  }
  const indexed = arr.map((s, i) => ({ ...s, idx: i })).reverse();
  el.innerHTML = `<div class="history-list">` + indexed.map(s => {
    if(editingHistoryIdx === s.idx){
      return `
      <div class="history-entry history-entry-editing">
        <input type="date" class="plain-input" id="editDateInput_${s.idx}" value="${s.date}" style="margin:0;padding:.5rem;font-size:16px;width:auto;flex:0 0 auto;min-height:2.5rem;">
        <span style="display:flex;gap:.2rem;">
          <button class="icon-btn" onclick="confirmHistoryDate(${s.idx})" aria-label="Save date">${checkIcon}</button>
          <button class="icon-btn" onclick="cancelHistoryDate()" aria-label="Cancel">✕</button>
        </span>
      </div>`;
    }
    return `
    <div class="history-entry">
      <span class="d date-edit-trigger" onclick="startEditHistoryDate(${s.idx})">${fmtDate(s.date)} ${editIcon}${feelBadgeHtml(s.feel)}</span>
      <span class="s">${s.sets.map(set => `${set.weight||'—'}×${set.reps||'—'}`).join(', ')}</span>
      ${s.note ? `<div class="history-note">"${escAttr(s.note)}"</div>` : ''}
    </div>`;
  }).join('') + `</div>`;
}

function startEditHistoryDate(idx){
  editingHistoryIdx = idx;
  renderHistory();
  const input = document.getElementById('editDateInput_' + idx);
  if(input) input.focus();
}
function cancelHistoryDate(){
  editingHistoryIdx = null;
  renderHistory();
}
function confirmHistoryDate(idx){
  const input = document.getElementById('editDateInput_' + idx);
  const newDate = input ? input.value : '';
  if(!newDate) return;
  const arr = data.sessions[selectedExercise];
  const entry = arr[idx];
  if(newDate === entry.date){
    editingHistoryIdx = null;
    render();
    return;
  }
  const conflictIdx = arr.findIndex((s, i) => i !== idx && s.date === newDate);
  if(conflictIdx >= 0){
    const ok = confirm(`There's already a session on ${fmtDate(newDate)} for this exercise. Merge these sets into it?`);
    if(!ok) return;
    arr[conflictIdx].sets = arr[conflictIdx].sets.concat(entry.sets);
    arr.splice(idx, 1);
  } else {
    entry.date = newDate;
  }
  arr.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  saveData();
  editingHistoryIdx = null;
  render();
}

function updateSet(i, field, val){
  todaySets[i][field] = val;
  const btn = document.getElementById('saveBtn');
  if(btn) btn.disabled = !todaySets.some(s => s.weight !== '' || s.reps !== '');
}
function stepValue(i, field, delta){
  let cur = parseFloat(todaySets[i][field]);
  if(isNaN(cur)) cur = 0;
  let next = cur + delta;
  if(next < 0) next = 0;
  next = field === 'weight' ? Math.round(next * 10) / 10 : Math.round(next);
  todaySets[i][field] = String(next);
  renderContent();
}
function setTodayFeel(val){
  todayFeel = (todayFeel === val) ? '' : val;
  ['easy','medium','hard'].forEach(f => {
    const el = document.getElementById('feelChip_' + f);
    if(el) el.classList.toggle('active', todayFeel === f);
  });
}
function updateTodayNote(val){
  todayNote = val;
}
function addSet(){ todaySets.push({weight:'', reps:''}); render(); }
function removeSet(i){
  todaySets.splice(i,1);
  if(todaySets.length === 0) todaySets = [{weight:'', reps:''}];
  render();
}

function feelLabel(f){
  return f === 'easy' ? 'Easy' : f === 'medium' ? 'Medium' : f === 'hard' ? 'Hard' : '';
}
function feelBadgeHtml(f){
  if(!f) return '';
  return ` <span class="feel-badge ${f}">${feelLabel(f)}</span>`;
}

function saveSession(){
  const cleanSets = todaySets.filter(s => s.weight !== '' || s.reps !== '');
  if(cleanSets.length === 0) return;

  if(!data.sessions[selectedExercise]) data.sessions[selectedExercise] = [];
  const list = data.sessions[selectedExercise];
  const existingIdx = list.findIndex(s => s.date === todayStr());
  const trimmedNote = todayNote.trim();
  if(existingIdx >= 0){
    list[existingIdx].sets = cleanSets;
    list[existingIdx].feel = todayFeel;
    list[existingIdx].note = trimmedNote;
  } else {
    list.push({ date: todayStr(), sets: cleanSets, feel: todayFeel, note: trimmedNote });
  }
  saveData();

  const note = document.getElementById('savedNote');
  if(note) note.textContent = 'Saved.';
  setTimeout(() => { const n = document.getElementById('savedNote'); if(n) n.textContent=''; }, 2000);

  todaySets = cleanSets.map(s => ({...s}));
  todayNote = trimmedNote;
  render();

  const check = document.getElementById('saveCheck');
  if(check){
    requestAnimationFrame(() => {
      check.classList.add('show');
      setTimeout(() => { check.classList.remove('show'); }, 300);
    });
  }
}

/* ---------- Settings ---------- */

function openSettings(){
  settingsTab = 'exercises';
  renderSettings();
  const versionEl = document.getElementById('settingsVersion');
  if(versionEl) versionEl.textContent = 'Lift Log v' + APP_VERSION;
  document.getElementById('settingsDialog').showModal();
}
function switchTab(tab){ settingsTab = tab; renderSettings(); }

function renderSettings(){
  document.getElementById('tabExercisesBtn').classList.toggle('active', settingsTab === 'exercises');
  document.getElementById('tabTemplatesBtn').classList.toggle('active', settingsTab === 'templates');
  document.getElementById('tabProgressBtn').classList.toggle('active', settingsTab === 'progress');
  document.getElementById('tabTimerBtn').classList.toggle('active', settingsTab === 'timer');
  document.getElementById('tabDataBtn').classList.toggle('active', settingsTab === 'data');
  document.getElementById('tabExercises').style.display = settingsTab === 'exercises' ? 'block' : 'none';
  document.getElementById('tabTemplates').style.display = settingsTab === 'templates' ? 'block' : 'none';
  document.getElementById('tabProgress').style.display = settingsTab === 'progress' ? 'block' : 'none';
  document.getElementById('tabTimer').style.display = settingsTab === 'timer' ? 'block' : 'none';
  document.getElementById('tabData').style.display = settingsTab === 'data' ? 'block' : 'none';

  renderExerciseSettings();
  renderTemplateSettings();
  renderProgressSettings();
  renderTimerSettings();
  renderDataSettings();
}

const eyeIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
const eyeOffIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.6 21.6 0 015.06-6.06M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a21.6 21.6 0 01-2.61 3.68M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>`;
const trashIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>`;
const upIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>`;
const downIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>`;
const editIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:.8rem;height:.8rem;vertical-align:-1px;"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>`;
const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>`;
const timerIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/><path d="M18.5 4.5l1.4 1.4"/></svg>`;
const pauseIconSmall = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
const resetIconSmall = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>`;

function renderExerciseSettings(){
  const el = document.getElementById('tabExercises');
  el.innerHTML = `<button class="add-template-btn" onclick="openAddExerciseFromSettings()">+ New exercise</button>` +
    `<div class="section-title">Drag order with the arrows. Hide keeps history but removes it from the main screen.</div>` +
    data.exercises.map((ex, i) => `
      <div class="settings-row">
        <div class="reorder-btns">
          <button class="icon-btn" onclick="moveExercise(${i},-1)" ${i===0?'disabled':''} aria-label="Move up">${upIcon}</button>
          <button class="icon-btn" onclick="moveExercise(${i},1)" ${i===data.exercises.length-1?'disabled':''} aria-label="Move down">${downIcon}</button>
        </div>
        <span class="name ${ex.hidden ? 'hidden-ex' : ''}">${escAttr(ex.name)}</span>
        <button class="icon-btn" onclick="toggleHidden(${i})" aria-label="${ex.hidden ? 'Show' : 'Hide'}">${ex.hidden ? eyeOffIcon : eyeIcon}</button>
        <button class="icon-btn" onclick="deleteExercise(${i})" aria-label="Delete permanently">${trashIcon}</button>
      </div>
    `).join('');
}

function moveExercise(i, dir){
  const j = i + dir;
  if(j < 0 || j >= data.exercises.length) return;
  [data.exercises[i], data.exercises[j]] = [data.exercises[j], data.exercises[i]];
  saveData();
  renderExerciseSettings();
  renderExerciseChips();
}
function toggleHidden(i){
  data.exercises[i].hidden = !data.exercises[i].hidden;
  saveData();
  renderExerciseSettings();
  ensureSelectedExercise();
  renderTemplateChips();
  renderExerciseChips();
  renderContent();
}
function deleteExercise(i){
  const ex = data.exercises[i];
  const hasHistory = data.sessions[ex.name] && data.sessions[ex.name].length > 0;
  const msg = hasHistory
    ? `Permanently delete "${ex.name}" and all its logged history? This can't be undone.`
    : `Permanently delete "${ex.name}"?`;
  if(!confirm(msg)) return;
  data.exercises.splice(i,1);
  delete data.sessions[ex.name];
  data.templates.forEach(t => { t.exercises = t.exercises.filter(n => n !== ex.name); });
  saveData();
  renderExerciseSettings();
  renderTemplateSettings();
  ensureSelectedExercise();
  renderTemplateChips();
  renderExerciseChips();
  renderContent();
}

function renderTemplateSettings(){
  const el = document.getElementById('tabTemplates');
  el.innerHTML = `<button class="add-template-btn" onclick="openNewTemplate()">+ New template</button>` +
    data.templates.map((t) => `
    <div class="template-item">
      <div class="template-item-head">
        <span class="name">${escAttr(t.name)}</span>
        <div class="template-actions">
          <button class="icon-btn edit-icon" data-tname="${escAttr(t.name)}" onclick="openEditTemplate(this.dataset.tname)" aria-label="Edit">✎</button>

}

/* ---------- Progress charts ---------- */

function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderProgressSettings(){
  const el = document.getElementById('tabProgress');
  if(!el) return;
  if(data.exercises.length === 0){
    el.innerHTML = `<div class="empty-prev">No exercises yet.</div>`;
    return;
  }
  if(!progressExercise || !data.exercises.some(e => e.name === progressExercise)){
    progressExercise = (selectedExercise && data.exercises.some(e => e.name === selectedExercise))
      ? selectedExercise
      : data.exercises[0].name;
  }
  el.innerHTML = `
    <div class="row-label">Exercise</div>
    <select class="plain-input" id="progressExerciseSelect" onchange="setProgressExercise(this.value)">
      ${data.exercises.map(ex => `<option value="${escAttr(ex.name)}" ${ex.name === progressExercise ? 'selected' : ''}>${escAttr(ex.name)}</option>`).join('')}
    </select>
    <div id="progressCharts"></div>
  `;
  renderProgressCharts();
}

function setProgressExercise(name){
  progressExercise = name;
  renderProgressCharts();
}

function renderProgressCharts(){
  const el = document.getElementById('progressCharts');
  if(!el) return;

  const sessions = (data.sessions[progressExercise] || []).slice()
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

  const points = sessions.map(s => {
    let top = null;
    s.sets.forEach(set => {
      const w = parseFloat(set.weight);
      const r = parseFloat(set.reps);
      if(isNaN(w)) return;
      if(!top || w > top.weight || (w === top.weight && !isNaN(r) && r > top.reps)){
        top = { weight: w, reps: isNaN(r) ? 0 : r };
      }
    });
    return top ? { date: s.date, weight: top.weight, reps: top.reps } : null;
  }).filter(Boolean);

  if(points.length < 2){
    el.innerHTML = `<div class="empty-prev" style="margin-top:.8rem;">Not enough logged sessions yet for ${escAttr(progressExercise)} to show a trend (need at least 2 with a weight logged).</div>`;
    return;
  }

  const weightChart = buildLineChart(points.map(p => ({ date: p.date, value: p.weight })), { color: 'var(--accent)', unit: 'kg', title: 'Top set weight' });
  const repsChart = buildLineChart(points.map(p => ({ date: p.date, value: p.reps })), { color: 'var(--good)', unit: 'reps', title: 'Top set reps' });

  const tableRows = points.slice().reverse().map(p => `
    <div class="history-entry">
      <span class="d">${fmtDate(p.date)}</span>
      <span class="s"><span class="num">${p.weight}</span> kg × <span class="num">${p.reps}</span> reps</span>
    </div>
  `).join('');

  el.innerHTML = `
    ${weightChart}
    ${repsChart}
    <div class="row-label" style="margin-top:.9rem;">Per session (top set)</div>
    <div class="history-list">${tableRows}</div>
  `;
}

function buildLineChart(points, opts){
  const { color, unit, title } = opts;
  const id = 'chart_' + (chartIdCounter++);
  const w = 300, h = 118;
  const padL = 10, padR = 10, padT = 24, padB = 20;

  const values = points.map(p => p.value);
  let min = Math.min(...values), max = Math.max(...values);
  if(min === max){ min -= 1; max += 1; }
  const rangePad = (max - min) * 0.15;
  min -= rangePad; max += rangePad;

  const n = points.length;
  const xStep = n > 1 ? (w - padL - padR) / (n - 1) : 0;
  const xy = points.map((p, i) => ({
    x: padL + i * xStep,
    y: padT + (1 - (p.value - min) / (max - min)) * (h - padT - padB),
    date: p.date,
    value: p.value
  }));

  const pathD = xy.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const maxVal = Math.max(...values);
  const prIdx = values.lastIndexOf(maxVal);
  const lastIdx = xy.length - 1;

  const circles = xy.map((p, i) => {
    const isPr = i === prIdx;
    const r = isPr ? 5 : 3.5;
    const label = escAttr(fmtDate(p.date)) + ': ' + p.value + ' ' + unit;
    return `
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${isPr ? color : 'var(--surface-hi)'}" stroke="${color}" stroke-width="2"/>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="11" fill="transparent" style="cursor:pointer;" onclick="showChartTip(event,'${id}','${label}')"/>
    `;
  }).join('');

  const lastPoint = xy[lastIdx];
  const labelAnchor = lastIdx === 0 ? 'start' : 'end';
  const labelX = lastIdx === 0 ? lastPoint.x : lastPoint.x;

  return `
    <div class="chart-card">
      <div class="chart-head">
        <span class="chart-title">${title}</span>
        <span class="chart-current"><span class="num" style="color:${color}">${points[lastIdx].value}</span> ${unit}</span>
      </div>
      <div class="chart-wrap" id="${id}_wrap">
        <svg viewBox="0 0 ${w} ${h}" class="chart-svg" preserveAspectRatio="none">
          <line x1="${padL}" y1="${padT}" x2="${w - padR}" y2="${padT}" class="chart-grid"/>
          <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" class="chart-grid"/>
          <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          ${circles}
          <text x="${labelX.toFixed(1)}" y="${(lastPoint.y - 9).toFixed(1)}" class="chart-point-label" text-anchor="${labelAnchor}" fill="${color}">${points[lastIdx].value}</text>
        </svg>
        <div class="chart-tip" id="${id}_tip" style="display:none;"></div>
      </div>
      <div class="chart-axis-labels"><span>${fmtDate(points[0].date)}</span><span>${fmtDate(points[points.length - 1].date)}</span></div>
    </div>
  `;
}

function showChartTip(evt, id, label){
  evt.stopPropagation();
  const wrap = document.getElementById(id + '_wrap');
  const tip = document.getElementById(id + '_tip');
  if(!wrap || !tip) return;
  const wrapRect = wrap.getBoundingClientRect();
  const targetRect = evt.target.getBoundingClientRect();
  const left = targetRect.left - wrapRect.left + targetRect.width / 2;
  const top = targetRect.top - wrapRect.top;
  tip.textContent = label;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.style.display = 'block';
  clearTimeout(tip._hideTimer);
  tip._hideTimer = setTimeout(() => { tip.style.display = 'none'; }, 2500);
}

/* ---------- Rest timer (floating) ---------- */

let restRemaining = 90;
let restRunning = false;
let restInterval = null;

function initRestTimer(){
  ensureSettings();
  restRemaining = data.settings.restSeconds;
  const icon = document.getElementById('restFabIcon');
  const resetBtn = document.getElementById('restResetBtn');
  if(icon) icon.innerHTML = timerIcon;
  if(resetBtn) resetBtn.innerHTML = resetIconSmall;
  renderRestFab();
}

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function renderRestFab(){
  const fab = document.getElementById('restFab');
  const icon = document.getElementById('restFabIcon');
  const text = document.getElementById('restFabText');
  const resetBtn = document.getElementById('restResetBtn');
  if(!fab) return;
  fab.classList.toggle('running', restRunning);
  const isIdle = !restRunning && restRemaining === data.settings.restSeconds;
  if(isIdle){
    icon.style.display = '';
    text.style.display = 'none';
    resetBtn.style.display = 'none';
  } else {
    icon.style.display = 'none';
    text.style.display = '';
    text.innerHTML = (restRunning ? '' : '') + fmtTime(restRemaining);
    resetBtn.style.display = '';
  }
  fab.setAttribute('aria-label', restRunning ? 'Pauzeer rusttimer' : (restRemaining > 0 && restRemaining < data.settings.restSeconds ? 'Hervat rusttimer' : 'Start rusttimer'));
}

function toggleRestTimer(){
  if(restRunning){
    pauseRestTimer();
  } else {
    if(restRemaining <= 0) restRemaining = data.settings.restSeconds;
    startRestTimer();
  }
}

function startRestTimer(){
  restRunning = true;
  clearInterval(restInterval);
  restInterval = setInterval(() => {
    restRemaining -= 1;
    if(restRemaining <= 0){
      restRemaining = 0;
      restRunning = false;
      clearInterval(restInterval);
      restInterval = null;
      restFinishedFlash();
    }
    renderRestFab();
  }, 1000);
  renderRestFab();
}

function pauseRestTimer(){
  restRunning = false;
  clearInterval(restInterval);
  restInterval = null;
  renderRestFab();
}

function resetRestTimer(){
  restRunning = false;
  clearInterval(restInterval);
  restInterval = null;
  restRemaining = data.settings.restSeconds;
  renderRestFab();
}

function restFinishedFlash(){
  const fab = document.getElementById('restFab');
  if(fab){
    fab.classList.add('done');
    setTimeout(() => fab.classList.remove('done'), 1800);
  }
  playBeep();
  if(navigator.vibrate){ try{ navigator.vibrate([200, 100, 200]); }catch(e){} }
}

function playBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const playTone = (delay) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.26);
    };
    playTone(0); playTone(0.3); playTone(0.6);
    setTimeout(() => { try{ ctx.close(); }catch(e){} }, 1200);
  }catch(e){ /* audio not available; visual + vibrate still fire */ }
}

/* ---------- CSV export / import ---------- */

const CSV_HEADER = ['Exercise','Date','Set','Weight','Reps','Feel','Note'];

function csvEscape(val){
  val = String(val === undefined || val === null ? '' : val);
  if(/[",\r\n]/.test(val)) return '"' + val.replace(/"/g, '""') + '"';
  return val;
}

function buildCSV(){
  const rows = [CSV_HEADER];
  data.exercises.forEach(ex => {
    const sessions = (data.sessions[ex.name] || []).slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    sessions.forEach(s => {
      s.sets.forEach((set, i) => {
        rows.push([ex.name, s.date, i + 1, set.weight, set.reps, s.feel || '', s.note || '']);
      });
    });
  });
  return rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
}

function downloadCsvFallback(csv, filename, note){
  try{
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    if(note) note.textContent = 'Saved.';
    setTimeout(() => { const n = document.getElementById('exportNote'); if(n) n.textContent = ''; }, 2000);
  }catch(e){
    if(note) note.textContent = 'Could not save the file.';
  }
}

async function exportCSV(){
  const csv = buildCSV();
  const filename = `lift-log-export-${todayStr()}.csv`;
  const note = document.getElementById('exportNote');

  const hasClaudeDownloads = window.claude && typeof window.claude.use === 'function';
  if(!hasClaudeDownloads){
    // Not running inside the Claude artifact viewer (e.g. self-hosted) — use a plain browser download.
    downloadCsvFallback(csv, filename, note);
    return;
  }

  try{
    const downloads = await window.claude.use('downloads');
    if(!downloads){
      downloadCsvFallback(csv, filename, note);
      return;
    }
    const result = await downloads.save({ filename, data: csv });
    if(note) note.textContent = result.status === 'saved' ? 'Saved.' : 'Sent.';
    setTimeout(() => { if(note) note.textContent = ''; }, 2500);
  }catch(err){
    const code = err && err.code;
    if(code === 'declined'){ return; }
    let msg = 'Could not save the file.';
    if(code === 'rate_limited') msg = 'Try again in a moment.';
    if(note) note.textContent = msg;
  }
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0].trim() === ''));
}

function handleImportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      importCSVText(String(reader.result));
    }catch(err){
      alert('Could not read that file: ' + err.message);
    }
    evt.target.value = '';
  };
  reader.onerror = () => alert('Could not read that file.');
  reader.readAsText(file);
}

function importCSVText(text){
  const rows = parseCSV(text);
  if(rows.length < 2){ alert('No data rows found in that file.'); return; }

  const header = rows[0].map(h => h.trim().toLowerCase());
  const idxEx = header.indexOf('exercise');
  const idxDate = header.indexOf('date');
  const idxSet = header.indexOf('set');
  const idxWeight = header.indexOf('weight');
  const idxReps = header.indexOf('reps');
  const idxFeel = header.indexOf('feel');
  const idxNote = header.indexOf('note');
  if(idxEx < 0 || idxDate < 0 || idxWeight < 0 || idxReps < 0){
    alert('This file doesn\'t match the expected format. Expected columns: Exercise, Date, Set, Weight, Reps.');
    return;
  }

  const grouped = {}; // "exercise||date" -> { sets:[{setNum, weight, reps}], feel, note }
  let skipped = 0;
  for(let i = 1; i < rows.length; i++){
    const r = rows[i];
    const exName = (r[idxEx] || '').trim();
    const date = (r[idxDate] || '').trim();
    if(!exName || !/^\d{4}-\d{2}-\d{2}$/.test(date)){ skipped++; continue; }
    const weight = (r[idxWeight] || '').trim();
    const reps = (r[idxReps] || '').trim();
    const feelVal = idxFeel >= 0 ? (r[idxFeel] || '').trim().toLowerCase() : '';
    const noteVal = idxNote >= 0 ? (r[idxNote] || '').trim() : '';
    const setNum = parseInt(r[idxSet], 10);
    const key = exName + '||' + date;
    if(!grouped[key]) grouped[key] = { sets: [], feel: '', note: '' };
    grouped[key].sets.push({ setNum: isNaN(setNum) ? grouped[key].sets.length + 1 : setNum, weight, reps });
    if(!grouped[key].feel && ['easy','medium','hard'].includes(feelVal)) grouped[key].feel = feelVal;
    if(!grouped[key].note && noteVal) grouped[key].note = noteVal;
  }

  const exerciseNames = [...new Set(Object.keys(grouped).map(k => k.split('||')[0]))];
  const newExercises = exerciseNames.filter(n => !data.exercises.some(e => e.name === n));
  const sessionCount = Object.keys(grouped).length;

  if(sessionCount === 0){
    alert('No valid rows found. Make sure dates are formatted as YYYY-MM-DD.');
    return;
  }

  let msg = `Import ${sessionCount} session${sessionCount === 1 ? '' : 's'} across ${exerciseNames.length} exercise${exerciseNames.length === 1 ? '' : 's'}`;
  if(newExercises.length) msg += `, adding ${newExercises.length} new exercise${newExercises.length === 1 ? '' : 's'}`;
  msg += `?\n\nAny existing session on the same exercise + date will be overwritten.`;
  if(skipped) msg += `\n\n(${skipped} row${skipped === 1 ? '' : 's'} skipped — missing exercise name or invalid date.)`;
  if(!confirm(msg)) return;

  newExercises.forEach(name => data.exercises.push({ name, hidden: false }));

  Object.entries(grouped).forEach(([key, group]) => {
    const [exName, date] = key.split('||');
    const sets = group.sets.sort((a, b) => a.setNum - b.setNum).map(s => ({ weight: s.weight, reps: s.reps }));
    if(!data.sessions[exName]) data.sessions[exName] = [];
    const list = data.sessions[exName];
    const existingIdx = list.findIndex(s => s.date === date);
    if(existingIdx >= 0){
      list[existingIdx].sets = sets;
      list[existingIdx].feel = group.feel;
      list[existingIdx].note = group.note;
    } else {
      list.push({ date, sets, feel: group.feel, note: group.note });
    }
  });
  Object.keys(data.sessions).forEach(ex => {
    data.sessions[ex].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  });

  saveData();
  ensureSelectedExercise();
  renderExerciseSettings();
  renderTemplateSettings();
  renderDataSettings();
  renderTemplateChips();
  renderExerciseChips();
  renderContent();
  alert(`Imported ${sessionCount} session${sessionCount === 1 ? '' : 's'}.`);
}

function renderDataSettings(){
  const el = document.getElementById('tabData');
  if(!el) return;
  ensureSettings();
  const totalSessions = Object.values(data.sessions).reduce((sum, list) => sum + list.length, 0);
  el.innerHTML = `
    <div class="section-title">Back up your logged history as a CSV file, or restore it on another device.</div>
    <button class="btn primary" style="width:100%;margin-bottom:.4rem;" onclick="exportCSV()">Export all data (${totalSessions} session${totalSessions === 1 ? '' : 's'})</button>
    <div class="saved-note" id="exportNote" style="margin-bottom:.6rem;"></div>

    <div class="row-label" style="margin-top:.3rem;">Backup email address</div>
    <input type="email" inputmode="email" class="plain-input" id="backupEmailInput" placeholder="you@example.com"
      value="${escAttr(data.settings.backupEmail)}" oninput="setBackupEmail(this.value)">
    <button class="btn" style="width:100%;" onclick="emailCSV()">Email CSV backup</button>
    <div class="saved-note" id="emailNote" style="margin-bottom:.2rem;"></div>
    <div class="section-title">Opens your phone's mail app with the data pasted into the message — a mailto link can't attach a real file. For a proper .csv file (or a very long history), use Export above instead.</div>

    <div class="section-title" style="margin-top:1rem;">Import a CSV in the same format (columns: Exercise, Date, Set, Weight, Reps, Feel, Note). Unknown exercises are added automatically; a session on the same exercise and date is overwritten.</div>
    <input type="file" accept=".csv,text/csv" id="importFileInput" style="display:none" onchange="handleImportFile(event)">
    <button class="btn" style="width:100%;" onclick="document.getElementById('importFileInput').click()">Import CSV…</button>
  `;
}

  ensureSettings();
  data.settings.backupEmail = val.trim();

function emailCSV(){
  ensureSettings();
  const note = document.getElementById('emailNote');
  const email = data.settings.backupEmail.trim();
  if(!email){
    if(note) note.textContent = 'Add an email address above first.';
    const input = document.getElementById('backupEmailInput');
    if(input) input.focus();
    return;
  }
  const csv = buildCSV();
  const subject = 'Lift Log backup - ' + todayStr();
  const mailUrl = 'mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(csv);

  if(mailUrl.length > 1800){
    if(note) note.textContent = 'This backup is large — your mail app may cut off part of the message. Consider Export instead for the full data.';
  } else if(note){
    note.textContent = 'Opening your mail app…';
    setTimeout(() => { const n = document.getElementById('emailNote'); if(n) n.textContent = ''; }, 3000);
  }

  const a = document.createElement('a');
  a.href = mailUrl;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function render(){
  renderTemplateChips();
  renderExerciseChips();
  renderContent();
}

const exerciseRowEl = document.getElementById('exerciseRow');
if(exerciseRowEl) exerciseRowEl.addEventListener('scroll', updateExerciseScrollButtons);

ensureSelectedExercise();
initRestTimer();
render();
</script>
</body>
</html>
